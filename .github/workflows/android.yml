name: Build Android APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Extract Android project
        run: |
          mkdir android-project
          unzip -o *.zip -d android-project

      - name: Find Android project
        run: |
          find android-project -name settings.gradle.kts -o -name settings.gradle

      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find android-project -name settings.gradle.kts -o -name settings.gradle | head -1)")
          echo "Project folder: $PROJECT"
          cd "$PROJECT"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android-project/**/app/build/outputs/apk/debug/*.apk
